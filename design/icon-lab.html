<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalba Icon Lab</title>
<link rel="stylesheet" href="../style.css">
<style>
/* Preview only: app icon options built from the kalba! mark. Everything is sized in em so one markup renders at any size. */
body { height: auto; }
.lab { max-width: 430px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
.lab h1 { font: 800 22px/1.1 var(--disp); margin: 0; letter-spacing: -.02em; }
.lab p { margin: 0; font-size: 14px; opacity: .72; }
.row { display: flex; align-items: center; gap: 16px; background: var(--card); border: 2.5px solid var(--key); border-radius: var(--r); box-shadow: 4px 4px 0 var(--key); padding: 14px; }
.row .lbl { font: 800 20px/1 var(--disp); width: 1.4em; }
.row .nm { flex: 1; font-size: 13px; opacity: .75; line-height: 1.3; }
.row .sz { display: flex; align-items: flex-end; gap: 10px; }
.ic { --s: 112px; font-size: var(--s); width: 1em; height: 1em; border-radius: .225em; overflow: hidden; position: relative; display: grid; place-items: center; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.ic.m { --s: 56px; } .ic.sm { --s: 32px; }
.ic svg { display: block; }
.mk { width: .62em; height: .62em; rotate: -8deg; }
.bang { display: flex; flex-direction: column; align-items: center; gap: .035em; rotate: 8deg; }
.bang i { width: .13em; height: .42em; border-radius: .07em; background: var(--b, #18161c); }
.bang svg { width: .21em; height: .21em; }
.kb { display: flex; align-items: flex-end; font: 800 .86em/.8em var(--disp); letter-spacing: -.05em; color: var(--c, #18161c); }
.kb .bang { margin: 0 0 .06em .04em; }
.kb .bang i { width: .11em; height: .36em; }
.kb .bang svg { width: .19em; height: .19em; }
</style>
</head>
<body>
<div class="lab">
  <h1>kalba! icon options</h1>
  <p>Each shown at 112, 56 and 32 px. Pick a letter.</p>
  <div id="rows" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<script>
const MARK = '<svg viewBox="0 0 46 46" aria-hidden="true"><rect x="4" y="4" width="17" height="17" rx="4" fill="#1f4be0"/><rect x="1" y="1" width="17" height="17" rx="4" fill="#ff3d8b"/><rect x="28" y="4" width="17" height="17" rx="4" fill="#6b3df0"/><rect x="25" y="1" width="17" height="17" rx="4" fill="#00a86b"/><rect x="4" y="28" width="17" height="17" rx="4" fill="#ffb300"/><rect x="1" y="25" width="17" height="17" rx="4" fill="#ff4a1c"/><rect x="28" y="28" width="17" height="17" rx="4" fill="#0097a7"/><rect x="25" y="25" width="17" height="17" rx="4" fill="#ff8a1f"/></svg>';
const bang = (b) => `<div class="bang" style="--b:${b}"><i></i>${MARK}</div>`;
const opts = [
  ['A', 'Mark on paper', '#f5f3ee', `<div class="mk">${MARK}</div>`],
  ['B', 'Mark on dark ink', '#18161c', `<div class="mk">${MARK}</div>`],
  ['C', 'Pink, big "!" with the mark as the dot', '#ff3d8b', `<div style="font-size:1.25em">${bang('#f5f3ee')}</div>`],
  ['D', 'k! on paper', '#f5f3ee', `<div class="kb">k${bang('#18161c')}</div>`],
  ['E', 'k! on yellow', '#ffe14d', `<div class="kb">k${bang('#18161c')}</div>`],
  ['F', 'k! on dark, paper letters', '#18161c', `<div class="kb" style="--c:#f5f3ee">k${bang('#f5f3ee')}</div>`],
  ['G', 'k! on blue, paper letters', '#1f4be0', `<div class="kb" style="--c:#f5f3ee">k${bang('#f5f3ee')}</div>`],
];
document.getElementById('rows').innerHTML = opts.map(([k, n, bg, inner]) =>
  `<div class="row"><span class="lbl">${k}</span><div class="sz">${['', 'm', 'sm'].map((c) => `<div class="ic ${c}" style="background:${bg}">${inner}</div>`).join('')}</div><span class="nm">${n}</span></div>`).join('');
</script>
</body>
</html>
